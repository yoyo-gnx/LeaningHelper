            { q: "3. 北条時宗が円覚寺の開山（初代住職）として宋（中国）から招いた禅僧はだれですか。", options: ["蘭渓道隆", "無学祖元", "鑑真", "栄西"], ans: 1, exp: "北条時宗は宋から「無学祖元」を招いて円覚寺を開山としました。建長寺の蘭渓道隆と区別しましょう。" },
            { q: "4. 円覚寺が属する禅宗の宗派はどれですか。", options: ["臨済宗", "曹洞宗", "黄檗宗", "浄土真宗"], ans: 0, exp: "円覚寺は臨済宗（円覚寺派）の本山です。武士の精神的支柱として鎌倉幕府に保護されました。" },
            { q: "5. 円覚寺境内にある「舎利殿」に関する説明として正しいものはどれですか。", options: ["神奈川県内で唯一の国宝建造物である", "室町時代に建てられた大仏殿である", "源頼朝の墓所として建てられた", "江戸時代に再建された木造三重塔である"], ans: 0, exp: "円覚寺舎利殿は神奈川県唯一の国宝建造物（建造物部門）であり、室町中期の禅宗様建築の代表例です。" },
            { q: "6. 円覚寺の山門（三門）が登場する、夏目漱石の有名な小説はどれですか。", options: ["『坊っちゃん』", "『草枕』", "『門』", "『心』"], ans: 2, exp: "夏目漱石が円覚寺の塔頭（帰源院）に参禅した体験をもとに執筆した作品が『門』です。" },
            { q: "7. 元寇（文永の役・弘安の役）の際、蒙古軍（元・高麗軍）を率いていた元の皇帝はだれですか。", options: ["チンギス=ハン", "フビライ=ハン", "オゴタイ=ハン", "シュレイマン"], ans: 1, exp: "元寇時の第5代皇帝はフビライ=ハンです。" },

        hard: [

            { q: "12. 円覚寺の国宝「洪鐘（おおがね）」を寄進した、北条時宗の子である第9代執権はだれですか。", options: ["北条泰時", "北条時定", "北条貞時", "北条師時"], ans: 2, exp: "関東最大の国宝梵鐘（洪鐘）は、1301年に第9代執権・北条貞時が国家安泰を祈願して寄進しました。" },
            { q: "13. 鎌倉幕府の最高評定機関である「評定衆」を設置した第3代執権はだれですか。", options: ["北条義時", "北条泰時", "北条重時", "北条時頼"], ans: 1, exp: "評定衆の設置（1225年）や御成敗式目の制定（1232年）は第3代執権・北条泰時の功績です。" },
            { q: "14. 臨済宗を日本に伝え、京都に建仁寺を開いた僧はだれですか。", options: ["道元", "栄西", "空海", "親鸞"], ans: 1, exp: "臨済宗の開祖は栄西（『喫茶養生記』の著者）。曹洞宗の開祖は道元です。" },

            { q: "17. 円覚寺舎利殿に導入されている建築様式で、唐様とも呼ばれ、細い部材や詰組（つめぐみ）が特徴的な様式はどれですか。", options: ["和様", "大仏様（天竺様）", "禅宗様（唐様）", "帝冠様式"], ans: 2, exp: "鎌倉時代に宋から伝わった建築様式は「禅宗様（唐様）」です。重源が東大寺再建に用いたのは「大仏様」です。" },
            { q: "18. 円覚寺開山・無学祖元が宋で元の将兵に斬られそうになった際、読んだとされる有名な偈（詩）に含まれる言葉はどれですか。", options: ["電光影裏に春風を斬る", "日日是好日", "諸行無常", "一期一会"], ans: 0, exp: "「臨剣の偈」で「電光影裏に春風を斬る（剣が光を放つ一瞬に春風を斬るようなものだ）」と述べ、刀を引かせた逸話があります。" },
            { q: "19. 北条時宗の時代の1274年（文永の役）で、集団戦法や新兵器（てつはう）に苦しめられた幕府軍の戦い方を描いた絵巻物はどれですか。", options: ["『伴大納言絵巻』", "『蒙古襲来絵詞』", "『鳥獣戯画』", "『平治物語絵巻』"], ans: 1, exp: "肥後国の御家人・竹崎季長が自身の功績を記録させたのが『蒙古襲来絵詞』です。" },

    kenchoji: {

            { q: "7. 建長寺の発祥とも関係する、精進料理として有名な野菜スープは何ですか。", options: ["けんちん汁", "ほうとう", "のっぺい汁", "豚汁"], ans: 0, exp: "「けんちん汁」は建長寺の「建長汁（けんちょうじる）」が訛ったものと伝えられています。" },
            { q: "8. 北条時頼が有力御家人であった三浦氏一族を滅ぼした1247年の合戦は何ですか。", options: ["和田合戦", "宝治合戦", "承久の乱", "霜月騒動"], ans: 1, exp: "1247年、北条時頼は三浦泰村らを倒し（宝治合戦）、北条氏の執権政治を固めました。" },

            { q: "10. 北条時頼が僧侶の姿に変装して諸国を巡り、庶民の暮らしを観察したという伝説を描いた謡曲（能）は何ですか。", options: ["『鉢の木』", "『敦盛』", "『道成寺』", "『隅田川』"], ans: 0, exp: "佐野源左衛門常世が貧しいながらも大切にしていた鉢の木（松・竹・梅）をくべて時頼をもてなした逸話を描いた『鉢の木』が有名です。" }

            { q: "12. 建長寺法堂の天井に描かれている「雲龍図」を手掛けた日本画家はだれですか。", options: ["横山大観", "小泉淳作", "平山郁夫", "東山魁夷"], ans: 1, exp: "2003年の創建750年を記念して小泉淳作画伯によって描かれた迫力ある雲龍図です。" },

let currentSpotKey = "";
let userAnswers = {};

function startQuiz(spotKey) {
    currentSpotKey = spotKey;
    const data = quizData[spotKey];
    document.getElementById("quiz-title").innerText = `${data.title} の問題（全20問）`;
    
    const freqContainer = document.getElementById("frequent-questions");
    freqContainer.innerHTML = "";
    data.frequent.forEach((item, idx) => {
        freqContainer.appendChild(renderQuestionCard(item, idx, "frequent", "【頻出】"));
    });

    const hardContainer = document.getElementById("hard-questions");
    hardContainer.innerHTML = "";
    data.hard.forEach((item, idx) => {
        hardContainer.appendChild(renderQuestionCard(item, idx + 10, "hard", "【難問】"));
    });

    document.getElementById("page-select").classList.add("hidden");
    document.getElementById("page-quiz").classList.remove("hidden");
    document.getElementById("page-result").classList.add("hidden");
    window.scrollTo(0, 0);
}

function renderQuestionCard(item, qIndex, type, badgeText) {
    const card = document.createElement("div");
    card.className = "question-card";
    const badgeClass = type === "frequent" ? "badge-frequent" : "badge-hard";
    let html = `<div class="question-title"><span class="${badgeClass}">${badgeText}</span> ${item.q}</div>`;
    item.options.forEach((opt, optIdx) => {
        html += `
            <label class="option-label">
                <input type="radio" name="q_${qIndex}" value="${optIdx}">
                ${["ア", "イ", "ウ", "エ"][optIdx]}. ${opt}
            </label>
        `;
    });
    card.innerHTML = html;
    return card;
}

function submitAnswers() {
    const data = quizData[currentSpotKey];
    const allQuestions = [...data.frequent, ...data.hard];
    let score = 0;
    userAnswers = {};

    allQuestions.forEach((item, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        const userAnsVal = selected ? parseInt(selected.value) : -1;
        userAnswers[idx] = userAnsVal;
        if (userAnsVal === item.ans) score++;
    });

    document.getElementById("score-text").innerText = `${score} / 20 点`;
    let comment = "";
    if (score === 20) comment = "完璧です！難関校（開成・聖光・麻布など）合格レベルの知識です！";
    else if (score >= 15) comment = "素晴らしい！難関校突破ラインをクリアしています！";
    else if (score >= 10) comment = "合格ラインまであと一歩！解説を読んでしっかり復習しましょう！";
    else comment = "解説をしっかり読んで、重要キーワードをもう一度整理してみましょう！";
    
    document.getElementById("score-comment").innerText = comment;

    const expContainer = document.getElementById("explanations-list");
    expContainer.innerHTML = "";
    allQuestions.forEach((item, idx) => {
        const expCard = document.createElement("div");
        expCard.className = "explanation-card";
        const userAnsIdx = userAnswers[idx];
        const isCorrect = userAnsIdx === item.ans;
        const labels = ["ア", "イ", "ウ", "エ"];
        const userAnsText = userAnsIdx >= 0 ? `${labels[userAnsIdx]}. ${item.options[userAnsIdx]}` : "未解答";
        const correctAnsText = `${labels[item.ans]}. ${item.options[item.ans]}`;

        expCard.innerHTML = `
            <div style="font-weight:bold; font-size:16px; margin-bottom:8px;">
                第${idx + 1}問: ${isCorrect ? '<span style="color:green;">〇 正解</span>' : '<span style="color:red;">× 不正解</span>'}
            </div>
            <div style="margin-bottom:6px;">${item.q}</div>
            <div style="margin-bottom:4px;">あなたの回答: <span class="your-answer">${userAnsText}</span></div>
            <div style="margin-bottom:8px;">正解: <span class="correct-text">${correctAnsText}</span></div>
            <div style="font-size:14px; color:#4a5568; background:#fff; padding:10px; border-radius:6px; border:1px solid #edf2f7;">
                <strong>【解説】</strong> ${item.exp}
            </div>
        `;
        expContainer.appendChild(expCard);
    });

    document.getElementById("page-quiz").classList.add("hidden");
    document.getElementById("page-result").classList.remove("hidden");
    window.scrollTo(0, 0);
}

function backToSelect() {
    document.getElementById("page-select").classList.remove("hidden");
    document.getElementById("page-quiz").classList.add("hidden");
    document.getElementById("page-result").classList.add("hidden");
    window.scrollTo(0, 0);
}
